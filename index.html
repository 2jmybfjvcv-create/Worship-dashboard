<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Worship Team — This Sunday</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #121A0F;
    --panel: #182219;
    --line: #263323;

    --cream: #FCF7EE;
    --tan: #F1DAB2;
    --blue: #BCD7EA;      /* default ring color */
    --brown: #7A4317;
    --orange: #F1832C;    /* unconfirmed indicator */
    --navy: #0C183B;
    --green: #4D6D41;

    /* mic colors, used only for VOX / vocal positions */
    --mic-white: #F5F5F0;
    --mic-yellow: #F2C94C;
    --mic-green: #7CB342;
    --mic-red: #D64545;

    --ink: var(--cream);
    --ink-dim: #B7C2AE;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    overflow: hidden;
  }

  body{
    background-image:
      radial-gradient(circle at 12% 0%, rgba(241,131,44,0.06), transparent 45%),
      radial-gradient(circle at 90% 100%, rgba(188,215,234,0.05), transparent 45%);
  }

  .wrap{
    height: 100vh;
    display: flex;
    flex-direction: column;
    padding: 2.8vh 4.5vw 2vh;
  }

  /* ---------- Header ---------- */
  header{
    text-align: center;
    flex-shrink: 0;
    margin-bottom: 2vh;
  }

  .eyebrow{
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: clamp(12px, 1.1vw, 15px);
    letter-spacing: 0.34em;
    text-transform: uppercase;
    color: var(--orange);
    margin-bottom: 0.6vh;
  }

  h1{
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: clamp(1.7rem, 3.4vw, 2.7rem);
    letter-spacing: -0.01em;
    margin: 0;
    color: var(--cream);
  }

  /* ---------- Sections ---------- */
  main{
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    gap: 1.6vh;
  }

  .team-section{
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .section-title{
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: clamp(11px, 1vw, 14px);
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: var(--ink-dim);
    margin: 0 0 1.6vh;
  }

  .section-divider{
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }

  .section-divider::before, .section-divider::after{
    content: '';
    height: 1px;
    flex: 1;
    max-width: 480px;
    background: var(--line);
  }

  .section-divider .dot{
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--line);
    flex-shrink: 0;
  }

  /* ---------- Grid ---------- */
  .grid{
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(calc(150px * var(--scale, 1)), 1fr));
    gap: calc(3vh * var(--scale, 1)) 2.2vw;
    width: 100%;
    max-width: 1440px;
  }

  .card{
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }

  .photo-ring{
    width: calc(clamp(78px, 8.4vw, 128px) * var(--scale, 1));
    height: calc(clamp(78px, 8.4vw, 128px) * var(--scale, 1));
    border-radius: 18px;
    padding: 3px;
    position: relative;
    background: var(--blue);
  }

  .photo-ring img{
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 15px;
    display: block;
    background: var(--panel);
  }

  .pending-dot{
    position: absolute;
    top: -3px;
    right: -3px;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--orange);
    border: 3px solid var(--bg);
    z-index: 2;
  }

  .role{
    margin-top: calc(1.4vh * var(--scale, 1));
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: calc(clamp(9px, 0.85vw, 11.5px) * var(--scale, 1));
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-dim);
  }

  .role .bullet{
    width: 5px;
    height: 5px;
    border-radius: 50%;
    flex-shrink: 0;
    background: var(--blue);
  }

  .name{
    margin-top: calc(0.5vh * var(--scale, 1));
    font-weight: 700;
    font-size: calc(clamp(0.9rem, 1.3vw, 1.2rem) * var(--scale, 1));
    color: var(--cream);
    line-height: 1.2;
  }

  /* ---------- Screen rotation (Team <-> Order of Service) ---------- */
  .stage{
    flex: 1;
    min-height: 0;
    position: relative;
  }

  .screen{
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.9s ease;
  }

  .screen.active{
    opacity: 1;
    pointer-events: auto;
  }

  .dots{
    flex-shrink: 0;
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-top: 1.2vh;
  }

  .dots span{
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--line);
    transition: background 0.4s ease;
  }

  .dots span.active{
    background: var(--orange);
  }

  /* ---------- Order of service ---------- */
  .order-list{
    columns: 2;
    column-gap: 4vw;
    width: 100%;
    max-width: 1200px;
  }

  .order-section{
    break-inside: avoid;
    margin-bottom: 2.4vh;
  }

  .order-header{
    display: flex;
    align-items: baseline;
    gap: 8px;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: clamp(0.95rem, 1.5vw, 1.25rem);
    color: var(--cream);
    margin-bottom: 0.8vh;
  }

  .order-header::before{
    content: '';
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--orange);
    flex-shrink: 0;
  }

  .order-songs{
    margin-left: 15px;
    padding-left: 12px;
    border-left: 1px solid var(--line);
  }

  .order-song{
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 0.5vh 0;
    font-size: clamp(0.82rem, 1.1vw, 1rem);
    color: var(--ink-dim);
  }

  .order-song .title{
    color: var(--ink);
  }

  .order-song .meta{
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .key-badge{
    flex-shrink: 0;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: clamp(9px, 0.8vw, 11px);
    letter-spacing: 0.06em;
    color: var(--bg);
    background: var(--blue);
    border-radius: 4px;
    padding: 2px 7px;
  }

  .leader-badge{
    flex-shrink: 0;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: clamp(9px, 0.8vw, 11px);
    letter-spacing: 0.06em;
    color: var(--bg);
    background: var(--tan);
    border-radius: 4px;
    padding: 2px 7px;
    white-space: nowrap;
  }

  .no-leader{
    flex-shrink: 0;
    font-style: italic;
    font-size: clamp(0.78rem, 1vw, 0.92rem);
    color: var(--ink-dim);
    opacity: 0.75;
    white-space: nowrap;
  }

  /* ---------- Footer ---------- */
  footer{
    flex-shrink: 0;
    text-align: center;
    margin-top: 1.4vh;
    font-size: 11px;
    letter-spacing: 0.04em;
    color: var(--ink-dim);
    opacity: 0.55;
  }

  /* ---------- Empty / error states ---------- */
  .empty{
    text-align: center;
    color: var(--ink-dim);
    font-size: clamp(1rem, 1.8vw, 1.3rem);
    max-width: 600px;
    line-height: 1.5;
  }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="eyebrow" id="eyebrow">Sunday Service</div>
    <h1 id="dateLine">Loading&hellip;</h1>
  </header>

  <div class="stage">
    <div class="screen active" id="screen-team">
      <main id="main"></main>
    </div>
    <div class="screen" id="screen-order">
      <div class="order-list" id="orderContent"></div>
    </div>
  </div>

  <div class="dots" id="dots"></div>

  <footer id="footer"></footer>
</div>

<script>
  const REFRESH_MS = 30 * 60 * 1000;      // re-check data every 30 min
  const RELOAD_MS = 6 * 60 * 60 * 1000;   // hard page reload every 6 hrs

  function formatUpdatedTime(){
    return new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  }

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str || '';
    return div.innerHTML;
  }

  // Vocal positions (VOX 1-4, or anything with "vocal" in the name) sort first;
  // everything else keeps its original relative order.
  function sortRolesVocalsFirst(members){
    function vocalRank(role){
      const m = /vox\s*(\d+)/i.exec(role || '');
      if (m) return parseInt(m[1], 10);
      if (/vocal/i.test(role || '')) return 0.5;
      return null;
    }
    return members
      .map((m, i) => ({ m, i, rank: vocalRank(m.role) }))
      .sort((a, b) => {
        const aVocal = a.rank !== null;
        const bVocal = b.rank !== null;
        if (aVocal && bVocal) return a.rank - b.rank;
        if (aVocal) return -1;
        if (bVocal) return 1;
        return a.i - b.i; // stable for non-vocal positions
      })
      .map((x) => x.m);
  }

  // Vocal positions get their mic's color; everything else uses the default light blue ring.
  function ringColorFor(role){
    const r = (role || '').toLowerCase();
    if (r.includes('white mic')) return 'var(--mic-white)';
    if (r.includes('yellow mic')) return 'var(--mic-yellow)';
    if (r.includes('green mic')) return 'var(--mic-green)';
    if (r.includes('red mic')) return 'var(--mic-red)';
    return 'var(--blue)';
  }

  function renderCard(person){
    const color = ringColorFor(person.role);
    return `
      <div class="card">
        <div class="photo-ring" style="background:${color}">
          ${!person.confirmed ? '<div class="pending-dot" title="Unconfirmed"></div>' : ''}
          <img src="${person.photo}" alt="${escapeHtml(person.name)}" onerror="this.style.opacity=0" />
        </div>
        <div class="role"><span class="bullet" style="background:${color}"></span>${escapeHtml(person.role || 'Serving')}</div>
        <div class="name">${escapeHtml(person.name)}</div>
      </div>
    `;
  }

  function renderSection(label, members){
    if (!members || members.length === 0) return '';
    const sorted = sortRolesVocalsFirst(members);
    return `
      <section class="team-section">
        <div class="section-title">${escapeHtml(label)}</div>
        <div class="grid">${sorted.map(renderCard).join('')}</div>
      </section>
    `;
  }

  // If a section wraps to 2+ rows and no longer fits its allotted space,
  // shrink it (photo, text, spacing together) just enough to fit cleanly --
  // instead of letting rows crowd or overlap each other.
  function fitSectionToHeight(el){
    let scale = 1;
    el.style.setProperty('--scale', scale);
    while (el.scrollHeight > el.clientHeight + 1 && scale > 0.55){
      scale -= 0.05;
      el.style.setProperty('--scale', scale.toFixed(2));
    }
  }

  function fitAllSections(){
    document.querySelectorAll('#main .team-section').forEach(fitSectionToHeight);
  }

  function renderOrderSection(section){
    const songs = (section.songs || []).map((song) => {
      const leaderHtml = song.leader
        ? `<span class="leader-badge">${escapeHtml(song.leader)}</span>`
        : `<span class="no-leader">No Leader</span>`;
      return `
        <div class="order-song">
          <span class="title">${escapeHtml(song.title)}</span>
          <span class="meta">
            ${song.key ? `<span class="key-badge">Key ${escapeHtml(song.key)}</span>` : ''}
            ${leaderHtml}
          </span>
        </div>
      `;
    }).join('');

    return `
      <div class="order-section">
        <div class="order-header">${escapeHtml(section.title)}</div>
        ${songs ? `<div class="order-songs">${songs}</div>` : ''}
      </div>
    `;
  }

  // ---------- Screen carousel (Team roster <-> Order of Service) ----------
  const SCREENS = [
    { id: 'screen-team', eyebrow: 'Sunday Service' },
    { id: 'screen-order', eyebrow: 'Order of Service' },
  ];
  const ROTATE_MS = 20 * 1000;
  let activeScreens = [SCREENS[0]]; // updated once data loads, based on what has content
  let carouselIndex = 0;
  let carouselTimer = null;

  function renderDots(){
    const dots = document.getElementById('dots');
    if (activeScreens.length <= 1){ dots.innerHTML = ''; return; }
    dots.innerHTML = activeScreens.map((_, i) =>
      `<span class="${i === carouselIndex ? 'active' : ''}"></span>`
    ).join('');
  }

  function showScreen(index){
    carouselIndex = index;
    const current = activeScreens[carouselIndex];
    SCREENS.forEach((s) => {
      document.getElementById(s.id).classList.toggle('active', s.id === current.id);
    });
    document.getElementById('eyebrow').textContent = current.eyebrow;
    renderDots();
  }

  function startCarousel(){
    if (carouselTimer) clearInterval(carouselTimer);
    showScreen(0);
    if (activeScreens.length <= 1) return;
    carouselTimer = setInterval(() => {
      showScreen((carouselIndex + 1) % activeScreens.length);
    }, ROTATE_MS);
  }

  async function loadTeam(){
    const main = document.getElementById('main');
    const orderContent = document.getElementById('orderContent');
    const dateLine = document.getElementById('dateLine');
    const footer = document.getElementById('footer');

    try{
      const res = await fetch('/api/team', { cache: 'no-store' });
      const data = await res.json();

      if (data.error) throw new Error(data.error);

      const teamEntries = Object.entries(data.teams || {}).filter(([, members]) => members && members.length > 0);
      const orderSections = data.order || [];

      if (!data.date || teamEntries.length === 0){
        dateLine.textContent = 'No Upcoming Service Found';
        main.innerHTML = '<div class="team-section"><div class="empty">Nothing is scheduled yet in Planning Center. Once a plan is scheduled, it will show up here automatically.</div></div>';
        orderContent.innerHTML = '';
        footer.textContent = 'Last checked ' + formatUpdatedTime();
        activeScreens = [SCREENS[0]];
        startCarousel();
        return;
      }

      dateLine.textContent = data.date;

      main.innerHTML = teamEntries
        .map(([label, members], i) => {
          const divider = i > 0 ? '<div class="section-divider"><span class="dot"></span></div>' : '';
          return divider + renderSection(label, members);
        })
        .join('');

      orderContent.innerHTML = orderSections.map(renderOrderSection).join('');

      requestAnimationFrame(fitAllSections);

      footer.textContent = 'Last updated ' + formatUpdatedTime() + ' · refreshes automatically';

      activeScreens = orderSections.length > 0 ? SCREENS : [SCREENS[0]];
      startCarousel();
    }catch(err){
      dateLine.textContent = 'Worship Team';
      main.innerHTML = '<div class="team-section"><div class="empty">Could not load the schedule right now. This will retry automatically — no action needed.</div></div>';
      footer.textContent = 'Last attempt ' + formatUpdatedTime();
      activeScreens = [SCREENS[0]];
      startCarousel();
    }
  }

  loadTeam();
  setInterval(loadTeam, REFRESH_MS);
  setTimeout(() => location.reload(), RELOAD_MS);
</script>

</body>
</html>
